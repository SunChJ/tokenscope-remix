[package]
name = "tokenscope"
version = "1.3.5"
description = "Menu-bar dashboard for local AI coding agents (Claude Code, Codex) token usage"
authors = ["you"]
edition = "2021"

[lib]
name = "tokenscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# The old `objc` crate (pulled in via tauri-nspanel) emits cfg(feature =
# "cargo-clippy") from its macros, which trips this lint at every msg_send!
# call site in our crate. Nothing we can fix locally — silence it.
unexpected_cfgs = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# decode the base64 PNG body of a screenshot data URL (see save_screenshot)
base64 = "0.22"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
walkdir = "2"
# watch ~/.claude/projects so the dashboard refreshes within ~1s of a log write
notify = "6"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
